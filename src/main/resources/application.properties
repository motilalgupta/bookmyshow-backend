spring.application.name=BookMyShow

spring.datasource.url=jdbc:mysql://localhost:3306/bms_bd?createDatabaseIfNotExist=true
spring.datasource.username=your username here
spring.datasource.password=your password here 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


server.port=8080

spring.output.ansi.enabled=ALWAYS

logging.pattern.console = %green(%d{HH:mm:ss.SSS}) %blue(%-5level) %yellow([%thread]) %red(%logger{15}) - %msg%n
